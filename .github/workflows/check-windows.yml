name: Windows Runtime Check

on:
  pull_request:
    paths:
      - ".github/workflows/check-windows.yml"
      - "apps/server/**"
      - "packages/**"
      - "scripts/package-tutti-app.mjs"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aimc/shared exec tsc --build tsconfig.json --force
      - run: pnpm --filter @aimc/server typecheck
      - run: pnpm --filter @aimc/server test
      - run: pnpm package:tutti
